<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Trainings-Tracker</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#20242d;--line:#2a2f3a;--txt:#eef0f4;--mut:#8b93a3;--acc:#4ade80;--acc2:#22c55e;--warn:#fbbf24;--bad:#f87171;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none}
button{font-family:inherit;touch-action:manipulation}
#app{display:flex;flex-direction:column;height:100%}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 14px) 14px 24px;max-width:640px;width:100%;margin:0 auto}
nav{display:flex;background:#12141a;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 4px 9px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:21px;line-height:1}
nav button.on{color:var(--acc)}
h1{font-size:26px;margin:4px 0 12px}
h2{font-size:17px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.mut{color:var(--mut)}.small{font-size:13px}
.strip{display:flex;gap:6px;margin-bottom:12px}
.strip button{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:8px 0;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-size:11px;font-weight:600}
.strip button.on{background:var(--acc);color:#04210f;border-color:var(--acc)}
.strip button.rest{opacity:.6}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.btn{display:block;width:100%;padding:15px;border-radius:14px;border:0;background:var(--acc);color:#04210f;font-size:17px;font-weight:700}
.btn.sec{background:var(--card2);color:var(--txt);font-weight:600}
.btn.sm{width:auto;display:inline-block;padding:9px 14px;font-size:14px;border-radius:10px}
.btn.danger{background:#3a1d1d;color:var(--bad)}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;font-size:14px;padding:8px}
.ex-title{font-size:18px;font-weight:700}
.tag{display:inline-block;font-size:12px;color:var(--mut);background:var(--card2);border-radius:8px;padding:2px 8px;margin-top:4px}
.wrow{display:flex;align-items:center;gap:8px;margin:12px 0}
.wrow .lbl,.set .lbl{color:var(--mut);font-size:12px;width:48px;flex:none}
.step{width:44px;height:44px;flex:none;border-radius:12px;border:0;background:var(--card2);color:var(--txt);font-size:22px;font-weight:600}
.step:active{background:var(--line)}
.chk{width:44px;height:44px;flex:none;border-radius:12px;border:2px solid var(--line);background:none;color:var(--mut);font-size:20px;font-weight:800}
.chk.on{background:var(--acc);border-color:var(--acc);color:#04210f}
.winp{flex:1;min-width:0;text-align:center;font-size:22px;font-weight:700;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--txt);height:44px}
.sets{display:grid;gap:8px}
.set{display:flex;align-items:center;gap:6px}
.set .val{flex:1;text-align:center;font-size:24px;font-weight:700;border-radius:12px;height:44px;line-height:42px;background:var(--bg);border:1px solid var(--line)}
.set .val.hit{border-color:var(--acc2);color:var(--acc)}
.set .val.miss{border-color:var(--warn);color:var(--warn)}
.foot{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--mut);display:grid;gap:3px}
.up{color:var(--acc)}.down{color:var(--bad)}.flat{color:var(--mut)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-size:14px;font-weight:600}
.chip.on{background:var(--acc);color:#04210f;border-color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--mut);font-weight:500;text-align:left;font-size:12px;padding:4px 4px}
td{padding:8px 4px;border-top:1px solid var(--line)}
td.r,th.r{text-align:right}
.sess{padding:12px 0;border-top:1px solid var(--line)}
.sess:first-child{border-top:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.f label{display:block;font-size:11px;color:var(--mut);margin-bottom:3px}
.f input,.f select,.nm,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px;font-size:16px;font-family:inherit}
.nm{margin-bottom:8px;font-weight:600}
textarea{height:90px;font-size:12px}
.exrow{padding:12px 0;border-top:1px solid var(--line)}
.exrow:first-of-type{border-top:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.modal .sheet{background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom) + 16px);width:100%;max-width:640px;max-height:85%;overflow-y:auto}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#333a47;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20}
#timer{position:relative;background:#14301f;border-top:1px solid #1f5a34;overflow:hidden;flex:none}
#timer[hidden]{display:none}
#timer.end{background:#166534}
#tbar{position:absolute;left:0;top:0;bottom:0;background:#1d4d30;width:0;transition:width .25s linear}
.trow{position:relative;display:flex;align-items:center;gap:8px;padding:10px 14px;max-width:640px;margin:0 auto}
#ttime{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;min-width:82px}
#tlabel{flex:1;font-size:13px;color:#b7e4c7;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.trow button{border:0;border-radius:10px;background:#0d2617;color:var(--txt);padding:10px 12px;font-size:14px;font-weight:600}
#upd{flex:none;width:100%;border:0;background:#166534;color:#fff;font-size:15px;font-weight:700;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
#upd[hidden]{display:none}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.bar.mid i{background:var(--warn)}.bar.low i{background:var(--bad)}
.lift{padding:12px 0;border-top:1px solid var(--line)}
svg text{fill:var(--mut);font-size:10px}
body.onb nav{display:none}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:14px;padding:14px;margin-bottom:10px;font-size:16px}
.opt.on{border-color:var(--acc);background:#14301f}
.lib{display:block;width:100%;text-align:left;background:var(--card2);border:0;color:var(--txt);padding:12px;border-radius:10px;margin-bottom:6px;font-size:15px}
.onb-dots{text-align:center;margin:4px 0 14px}
.bullet{margin:0 0 8px;padding-left:4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:11px;color:var(--mut);padding-bottom:2px}
.cd{width:100%;max-width:36px;aspect-ratio:1;margin:0 auto;border-radius:50%;border:2px solid transparent;background:var(--card2);color:var(--mut);font-size:13px;font-weight:600;padding:0;display:flex;align-items:center;justify-content:center}
.cd.t{background:var(--acc);color:#04210f;font-size:16px;font-weight:800}
.cd.r{background:#2563eb;color:#fff;font-size:16px;font-weight:800}
.cd.today{border-color:var(--txt)}
.cd.fut{opacity:.35}
.dinp{background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:8px 10px;font-size:16px;font-family:inherit;color-scheme:dark}
.navb{flex:none;width:34px;height:34px;border-radius:10px;border:0;background:var(--card2);color:var(--txt);font-size:20px}
</style>
</head>
<body>
<div id="app">
  <button id="upd" data-act="upd" hidden>🔄 Neue Version verfügbar – hier tippen</button>
  <main id="main"></main>
  <div id="timer" hidden><div id="tbar"></div><div class="trow"><span id="ttime">0:00</span><span id="tlabel"></span><button data-act="tadd" data-n="-15">−15</button><button data-act="tadd" data-n="15">+15</button><button data-act="tstop">✕</button></div></div>
  <nav>
    <button data-tab="today"><span class="ic">🏋️</span>Training</button>
    <button data-tab="progress"><span class="ic">📈</span>Fortschritt</button>
    <button data-tab="plan"><span class="ic">⚙️</span>Plan</button>
  </nav>
</div>
<script>
'use strict';
/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (Math.round(n * 100) / 100).toString().replace('.', ',');
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : NaN; };
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const round025 = n => Math.round(n * 4) / 4;
const dateStr = t => new Date(t).toLocaleDateString('de-DE', {day: '2-digit', month: '2-digit', year: '2-digit'});
const shortDate = t => { const d = new Date(t); return d.getDate() + '.' + (d.getMonth() + 1) + '.'; };

/* ---------- Konstanten ---------- */
// Trainingstage sind frei konfigurierbar: S.days = [{id, name, short}], S.cycle = [Tag-ID | 'rest', ...], S.plan = {Tag-ID: [Übungen]}
const dayName = id => id === 'rest' ? 'Pause' : ((S.days.find(d => d.id === id) || {}).name || ((S.sessions.slice().reverse().find(x => x.type === id) || {}).label) || 'Alter Tag');
const LABEL = new Proxy({}, {get: (_, id) => dayName(id)});
const SHORT = new Proxy({}, {get: (_, id) => id === 'rest' ? 'Pause' : ((S.days.find(d => d.id === id) || {}).short || dayName(id).slice(0, 5))});
const dayIds = () => S.days.map(d => d.id);
const allDayIds = () => [...new Set([...dayIds(), ...S.sessions.map(x => x.type)])];   // auch gelöschte Tage mit Verlauf
const planOf = id => S.plan[id] || [];
const busy = () => !!(S.draft && S.draft.entries.some(e => e.done.some(Boolean)));
const MODES = {w: 'Gewicht', bw: 'Körpergewicht + Zusatz', r: 'Nur Wiederholungen'};
const APP_V = 2;   // bei jeder Veröffentlichung erhöhen (auch in version.json)
const KEY = 'tt.app.v1';   // eigener Speicher, unabhängig von anderen Apps auf derselben Domain

// mode: w = Hantel/Gerät, bw = Körpergewicht (+ Zusatzgewicht), r = nur Wiederholungen
const X = (id, name, sets, min, max, weight, rest = 90, mode = 'w', inc = 2.5) => ({id, name, sets, min, max, weight, inc, rest, mode});
function templatePlan() {
  return {
    push: [X('push_bench', 'Bankdrücken', 3, 5, 8, 0, 150), X('push_ohp', 'Schulterdrücken (Kurzhantel)', 3, 8, 12, 0, 120), X('push_incl', 'Kurzhantel-Schrägbankdrücken', 3, 8, 12, 0), X('push_lat', 'Seitheben', 3, 12, 15, 0), X('push_tri', 'Kurzhantel-Trizeps-Extensions', 3, 10, 15, 0)],
    pull: [X('pull_chin', 'Klimmzüge', 3, 6, 10, 0, 150, 'bw'), X('pull_row', 'Langhantel-Rudern', 3, 6, 10, 0, 120), X('pull_rfly', 'Reverse Fly', 3, 12, 15, 0), X('pull_inc', 'Incline Curl (Kurzhantel)', 3, 8, 12, 0), X('pull_ham', 'Hammer Curls', 3, 10, 15, 0)],
    legs: [X('legs_squat', 'Kniebeugen', 3, 5, 8, 0, 150), X('legs_rdl', 'Rumänisches Kreuzheben', 3, 6, 10, 0, 120), X('legs_bss', 'Bulgarian Split Squats', 3, 8, 12, 0, 120), X('legs_calf', 'Wadenheben (Kurzhantel)', 3, 10, 15, 0), X('legs_hlr', 'Hanging Leg Raises', 3, 8, 15, 0, 60, 'r')],
    upper: [X('up_bench', 'Bankdrücken', 3, 8, 10, 0, 120), X('up_chin', 'Klimmzüge', 3, 6, 10, 0, 120, 'bw'), X('up_fly', 'Fly', 3, 10, 15, 0), X('up_row', 'Kurzhantel-Rudern', 3, 8, 12, 0), X('up_tri', 'Kurzhantel-Trizeps-Extensions', 3, 10, 15, 0)],
    lower: [X('low_squat', 'Kniebeugen', 3, 8, 10, 0, 120), X('low_bss', 'Bulgarian Split Squats', 3, 8, 12, 0, 120), X('low_rdl', 'Rumänisches Kreuzheben', 3, 8, 10, 0, 120), X('low_calf', 'Wadenheben (Kurzhantel)', 3, 10, 15, 0), X('low_hlr', 'Hanging Leg Raises', 3, 8, 15, 0, 60, 'r')]
  };
}
const TEMPLATE_INFO = {
  ppl5: {label: '5 Tage: Push / Pull / Beine + Ober- / Unterkörper', desc: 'Push → Pull → Beine → Pause → Oberkörper → Unterkörper → Pause'},
  ppl6: {label: '6 Tage: Push / Pull / Beine (2×)', desc: 'Push → Pull → Beine → Push → Pull → Beine → Pause'},
  ul4: {label: '4 Tage: Oberkörper / Unterkörper (2×)', desc: 'Ober A → Unter A → Pause → Ober B → Unter B → Pause → Pause'},
  ppl3: {label: '3 Tage: Push / Pull / Beine', desc: 'Push → Pause → Pull → Pause → Beine → Pause → Pause'},
  fb3: {label: '3 Tage: Ganzkörper', desc: 'Ganz A → Pause → Ganz B → Pause → Ganz C → Pause → Pause'},
  custom: {label: 'Selbst bauen (leer)', desc: 'Du legst Tage und Übungen komplett selbst an.'}
};
function buildTemplate(key) {
  const P = templatePlan(), std = [['push', 'Push', 'Push'], ['pull', 'Pull', 'Pull'], ['legs', 'Beine', 'Beine'], ['upper', 'Oberkörper', 'Ober'], ['lower', 'Unterkörper', 'Unter']];
  const mk = (list, cycle) => ({days: list.map(([id, name, short]) => ({id, name, short})), plan: JSON.parse(JSON.stringify(Object.fromEntries(list.map(([id, , , ex]) => [id, ex || P[id] || []])))), cycle});
  if (key === 'ppl3') return mk(std.slice(0, 3), ['push', 'rest', 'pull', 'rest', 'legs', 'rest', 'rest']);
  if (key === 'ppl6') return mk(std.slice(0, 3), ['push', 'pull', 'legs', 'push', 'pull', 'legs', 'rest']);
  if (key === 'ul4') return mk([
    ['uA', 'Oberkörper A', 'Ober A', [X('uA_1', 'Bankdrücken', 3, 5, 8, 0, 150), X('uA_2', 'Langhantel-Rudern', 3, 6, 10, 0, 120), X('uA_3', 'Schulterdrücken (Kurzhantel)', 3, 8, 12, 0, 120), X('uA_4', 'Klimmzüge', 3, 6, 10, 0, 120, 'bw'), X('uA_5', 'Kurzhantel-Trizeps-Extensions', 3, 10, 15, 0)]],
    ['lA', 'Unterkörper A', 'Unt A', [X('lA_1', 'Kniebeugen', 3, 5, 8, 0, 150), X('lA_2', 'Rumänisches Kreuzheben', 3, 6, 10, 0, 120), X('lA_3', 'Bulgarian Split Squats', 3, 8, 12, 0, 120), X('lA_4', 'Wadenheben (Kurzhantel)', 3, 10, 15, 0), X('lA_5', 'Hanging Leg Raises', 3, 8, 15, 0, 60, 'r')]],
    ['uB', 'Oberkörper B', 'Ober B', [X('uB_1', 'Kurzhantel-Schrägbankdrücken', 3, 8, 12, 0, 120), X('uB_2', 'Kurzhantel-Rudern', 3, 8, 12, 0, 120), X('uB_3', 'Seitheben', 3, 12, 15, 0), X('uB_4', 'Incline Curl (Kurzhantel)', 3, 8, 12, 0), X('uB_5', 'Fly', 3, 10, 15, 0)]],
    ['lB', 'Unterkörper B', 'Unt B', [X('lB_1', 'Kniebeugen', 3, 8, 10, 0, 120), X('lB_2', 'Rumänisches Kreuzheben', 3, 8, 10, 0, 120), X('lB_3', 'Beinpresse', 3, 10, 12, 0, 120), X('lB_4', 'Wadenheben (Kurzhantel)', 3, 10, 15, 0), X('lB_5', 'Hanging Leg Raises', 3, 8, 15, 0, 60, 'r')]]
  ], ['uA', 'lA', 'rest', 'uB', 'lB', 'rest', 'rest']);
  if (key === 'fb3') return mk([
    ['fa', 'Ganzkörper A', 'Ganz A', [X('fa_1', 'Kniebeugen', 3, 5, 8, 0, 150), X('fa_2', 'Bankdrücken', 3, 5, 8, 0, 150), X('fa_3', 'Langhantel-Rudern', 3, 6, 10, 0, 120), X('fa_4', 'Seitheben', 3, 12, 15, 0), X('fa_5', 'Hanging Leg Raises', 3, 8, 15, 0, 60, 'r')]],
    ['fb', 'Ganzkörper B', 'Ganz B', [X('fb_1', 'Rumänisches Kreuzheben', 3, 6, 10, 0, 120), X('fb_2', 'Schulterdrücken (Kurzhantel)', 3, 8, 12, 0, 120), X('fb_3', 'Klimmzüge', 3, 6, 10, 0, 150, 'bw'), X('fb_4', 'Bulgarian Split Squats', 3, 8, 12, 0, 120), X('fb_5', 'Incline Curl (Kurzhantel)', 3, 8, 12, 0)]],
    ['fc', 'Ganzkörper C', 'Ganz C', [X('fc_1', 'Kniebeugen', 3, 8, 10, 0, 120), X('fc_2', 'Kurzhantel-Schrägbankdrücken', 3, 8, 12, 0, 120), X('fc_3', 'Kurzhantel-Rudern', 3, 8, 12, 0, 120), X('fc_4', 'Hammer Curls', 3, 10, 15, 0), X('fc_5', 'Kurzhantel-Trizeps-Extensions', 3, 10, 15, 0)]]
  ], ['fa', 'rest', 'fb', 'rest', 'fc', 'rest', 'rest']);
  if (key === 'custom') return mk([['t1', 'Tag 1', 'Tag 1', []]], ['t1', 'rest']);
  return mk(std, ['push', 'pull', 'legs', 'rest', 'upper', 'lower', 'rest']);
}
function freshState() {
  const T = buildTemplate('ppl5');
  return {days: T.days, cycle: T.cycle, plan: T.plan, pos: 0, sessions: [], draft: null, settings: {bw: 70, cmp: 'all'}, weights: [], rests: [], profile: null};
}

// Übungsauswahl: [Name, Sätze, Wdh. von, Wdh. bis, Pause, Art]
const LIB = [
  ['Brust', [['Bankdrücken', 3, 5, 8, 150], ['Kurzhantel-Schrägbankdrücken', 3, 8, 12, 120], ['Kurzhantel-Bankdrücken', 3, 8, 12, 120], ['Fly', 3, 10, 15, 90], ['Brustpresse (Maschine)', 3, 8, 12, 90], ['Liegestütze', 3, 8, 20, 90, 'r'], ['Dips', 3, 6, 12, 120, 'bw']]],
  ['Schultern', [['Schulterdrücken (Kurzhantel)', 3, 8, 12, 120], ['Schulterdrücken sitzend (Langhantel)', 3, 6, 10, 120], ['Seitheben', 3, 12, 15, 90], ['Reverse Fly', 3, 12, 15, 90], ['Frontheben', 3, 10, 15, 90]]],
  ['Rücken', [['Klimmzüge', 3, 6, 10, 150, 'bw'], ['Latzug', 3, 8, 12, 120], ['Langhantel-Rudern', 3, 6, 10, 120], ['Kurzhantel-Rudern', 3, 8, 12, 120], ['Rudern am Kabel', 3, 10, 12, 90]]],
  ['Bizeps', [['Incline Curl (Kurzhantel)', 3, 8, 12, 90], ['Hammer Curls', 3, 10, 15, 90], ['Langhantel-Curls', 3, 8, 12, 90], ['Kurzhantel-Curls', 3, 8, 12, 90]]],
  ['Trizeps', [['Kurzhantel-Trizeps-Extensions', 3, 10, 15, 90], ['Trizepsdrücken (Kabel)', 3, 10, 15, 90]]],
  ['Beine', [['Kniebeugen', 3, 5, 8, 150], ['Rumänisches Kreuzheben', 3, 6, 10, 120], ['Stiff-Legged Deadlift', 3, 6, 10, 120], ['Sumo Deadlift', 3, 6, 10, 120], ['Bulgarian Split Squats', 3, 8, 12, 120], ['Beinpresse', 3, 8, 12, 120], ['Ausfallschritte', 3, 10, 12, 90], ['Beinstrecker', 3, 10, 15, 90], ['Beinbeuger', 3, 10, 15, 90], ['Hip Thrust', 3, 8, 12, 120], ['Wadenheben (Kurzhantel)', 3, 10, 15, 60]]],
  ['Bauch', [['Hanging Leg Raises', 3, 8, 15, 60, 'r'], ['Crunches', 3, 12, 20, 60, 'r']]]
];
function libModal(day) {
  return `<div class="modal"><div class="sheet"><div class="row"><h2 style="margin:0">Übung hinzufügen</h2><div class="sp"></div><button class="link" data-act="closemodal">Schließen</button></div>
    <input class="nm" data-libq placeholder="Suchen …" style="margin-top:10px">
    ${LIB.map(([cat, items], ci) => `<div class="libcat"><div class="small mut" style="margin:10px 0 4px">${cat}</div>${items.map((it, ii) => `<button class="lib" data-act="libadd" data-t="${day}" data-c="${ci}" data-i="${ii}">${esc(it[0])} <span class="mut small">· ${it[1]}×${it[2]}–${it[3]}${it[5] === 'r' ? ' Wdh.' : ''}</span></button>`).join('')}</div>`).join('')}
    <div class="card" style="margin-top:12px"><b>Eigene Übung</b><input class="nm" data-libname placeholder="Name der Übung" style="margin-top:8px">
      <div class="f"><label>Art</label><select data-libmode><option value="w">Gewicht</option><option value="bw">Körpergewicht + Zusatz</option><option value="r">Nur Wiederholungen</option></select></div>
      <button class="btn sm" style="margin-top:10px" data-act="libcustom" data-t="${day}">Hinzufügen</button></div></div></div>`;
}
function addExercise(day, name, mode, sets, min, max, rest) {
  const ex = X(day + '_' + uid(), name, sets, min, max, 0, rest, mode);

  S.plan[day] = planOf(day).concat([ex]);
}
function migrateState(d) {
  if (!Array.isArray(d.days) || !Array.isArray(d.cycle)) {   // Stand vor den frei wählbaren Plänen: fester 5-Tage-Plan
    const nm = {push: ['Push', 'Push'], pull: ['Pull', 'Pull'], legs: ['Beine', 'Beine'], upper: ['Oberkörper', 'Ober'], lower: ['Unterkörper', 'Unter']};
    d.days = Object.keys(d.plan).map(id => ({id, name: (nm[id] || [id])[0], short: (nm[id] || [0, id.slice(0, 5)])[1]}));
    d.cycle = ['push', 'pull', 'legs', 'rest', 'upper', 'lower', 'rest'].filter(x => x === 'rest' || d.plan[x]);
  }
  d.days.forEach(x => { if (!d.plan[x.id]) d.plan[x.id] = []; });
  if (!d.cycle.some(x => x !== 'rest')) d.cycle = d.days.length ? [d.days[0].id, 'rest'] : d.cycle;

}

// Startgewichte: aus den Vergleichswerten geschätzt (Erfahrung + Körpergewicht + Geschlecht), Vorgaben des Nutzers haben Vorrang
const LEVEL_P = {beginner: 10, mid: 35, adv: 60};   // Prozent der Lifter, die man als Startniveau annimmt
const MAIN = [
  {k: 'bench', label: 'Bankdrücken', keys: ['bench']},
  {k: 'squat', label: 'Kniebeugen', keys: ['squat']},
  {k: 'dead', label: 'Kreuzheben (Rumänisch / Stiff-Legged / Sumo)', keys: ['rdl', 'sldl', 'sumo']},
  {k: 'ohp', label: 'Schulterdrücken (bei Kurzhanteln pro Hantel)', keys: ['dbpress', 'ohp']}
];
function liftDefFor(name) {
  return LIFT_DEFS.find(D => D.re.test(name) && !(D.not && D.not.test(name)) && !(D.need && !D.need.test(name))) || null;
}
function startWeight(ex, prof, bw) {
  if (ex.mode !== 'w') return 0;
  const D = liftDefFor(ex.name);
  if (!D || D.reps) return Math.max(2.5, Math.floor(bw * ({beginner: 0.2, mid: 0.3, adv: 0.45}[prof.level] || 0.2) / 2.5) * 2.5);   // Faustformel für Übungen ohne Vergleichswerte
  const v = valAtP(stdAt(D.key, bw), LEVEL_P[prof.level] || 10);
  const w = v / (1 + (ex.min + ex.max) / 2 / 30);
  const bar = /langhantel|bankdrück|kniebeug|kreuzheb|deadlift/i.test(ex.name) ? 20 : 2.5;   // Langhantelstange wiegt 20 kg
  return Math.max(bar, Math.floor(w / 2.5) * 2.5);
}
function applyStart(plan, prof, bw, given) {
  const all = Object.values(plan).flat();
  all.forEach(ex => { ex.weight = startWeight(ex, prof, bw); });
  MAIN.forEach(m => {
    const g = num(given[m.k]);
    if (!isFinite(g) || g <= 0) return;
    all.filter(ex => { const D = liftDefFor(ex.name); return D && m.keys.includes(D.key); }).forEach(ex => { ex.weight = Math.max(2.5, Math.round(g * (1 + 8 / 30) / (1 + (ex.min + ex.max) / 2 / 30) / 2.5) * 2.5); });   // Angabe gilt für ca. 8 Wdh.
  });
}

/* ---------- State ---------- */
let S;
function load() {
  let raw = null;

    try {
      const d = JSON.parse(raw);
      if (d && d.plan && Array.isArray(d.sessions) && Number.isInteger(d.pos)) {
        d.settings = Object.assign({bw: 70, cmp: 'all'}, d.settings);
        if (!Array.isArray(d.weights)) d.weights = [];
        if (!Array.isArray(d.rests)) d.rests = [];
        migrateState(d);
        return d;
      }
    } catch (e) {}
    try { localStorage.setItem(KEY + '.corrupt', raw); } catch (e) {}   // defekte Daten nicht überschreiben, sondern sichern
  }

}

}
S = load(); save();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

const latestKg = () => S.weights.length ? S.weights[S.weights.length - 1].kg : S.settings.bw;
function addWeight(kg) {
  const day = new Date().toDateString(), ex = S.weights.find(w => new Date(w.date).toDateString() === day);
  if (ex) { ex.kg = kg; ex.date = Date.now(); } else S.weights.push({id: uid(), date: Date.now(), kg});
  S.weights.sort((a, b) => a.date - b.date);
  S.settings.bw = latestKg();
  S.days.forEach(d => invalidateDraft(d.id));

}

const ui = {tab: 'today', progType: 'push', progEx: null, openSession: null, modal: null};

/* ---------- Domain ---------- */
// Wiederholungen, die zählen: im laufenden Training nur abgehakte Sätze
const effReps = e => e.done ? e.reps.map((r, i) => e.done[i] ? r : 0) : e.reps;
const setW = (e, i) => e.ws && e.ws[i] !== undefined ? e.ws[i] : e.weight;
const load1 = (e, i) => e.mode === 'r' ? 1 : e.mode === 'bw' ? (e.bw || 0) + setW(e, i) : setW(e, i);

  if (e.mode === 'bw') return vary ? e.ws.map(w => w ? '+' + fmt(w) : 'KG').join(' / ') + ' kg' : (e.weight ? 'KG + ' + fmt(e.weight) + ' kg' : 'Körpergewicht');
  return vary ? e.ws.map(fmt).join(' / ') + ' kg' : fmt(e.weight) + ' kg';
};
function exList(type) {
  const list = planOf(type).map(p => ({id: p.id, name: p.name, mode: p.mode, plan: p}));
  const seen = new Set(list.map(x => x.id));
  S.sessions.filter(s => s.type === type).forEach(s => s.entries.forEach(e => {
    if (!seen.has(e.exId)) { seen.add(e.exId); list.push({id: e.exId, name: e.name, mode: e.mode, old: true}); }
  }));

}
const lastSession = type => { for (let i = S.sessions.length - 1; i >= 0; i--) if (S.sessions[i].type === type) return S.sessions[i]; return null; };
const lastEntry = exId => {

};
function delta(cur, prev, u = 'kg') {

}

        // Gleiches Gewicht wie letztes Mal: Wiederholungen von damals vorschlagen, sonst von der unteren Grenze starten
        const reps = Array.from({length: p.sets}, (_, i) => pe && pe.mode === p.mode && setW(pe, i) === p.weight && pe.reps[i] ? Math.min(99, pe.reps[i]) : p.min);

function chart(points, u = 'kg') {
  const pts = points.slice(-12);
  if (!pts.length) return '<p class="mut small">Noch keine Daten.</p>';
  const W = 320, H = 150, pad = 22, bw = Math.min(28, (W - 20) / pts.length - 6);
  const max = Math.max(...pts.map(p => p.value), 1);
  const step = (W - 20) / pts.length;
  const bars = pts.map((p, i) => {
    const bh = Math.max(2, (H - pad - 18) * p.value / max), x = 10 + i * step + (step - bw) / 2, y = H - pad - bh;
    const last = i === pts.length - 1;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="4" fill="${last ? '#4ade80' : '#3b4252'}"/>
      <text x="${x + bw / 2}" y="${y - 4}" text-anchor="middle">${p.value >= 1000 ? fmt(p.value / 1000) + 'k' : fmt(p.value)}</text>
      <text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${esc(p.label)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${bars}</svg>`;
}

const dayKey = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
function activity() {
  const t = new Set(), r = new Set();
  S.sessions.forEach(x => t.add(dayKey(x.date)));
  S.rests.forEach(x => r.add(dayKey(x.date)));
  return {t, r};
}
function streak() {
  const {t, r} = activity(), has = k => t.has(k) || r.has(k);
  const d = new Date(); d.setHours(12, 0, 0, 0);
  if (!has(dayKey(d))) d.setDate(d.getDate() - 1);   // heute noch offen: Serie zählt bis gestern
  let n = 0;
  while (has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function weekStreak() {
  const {t} = activity();
  const monday = d => { const x = new Date(d); x.setHours(12, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
  const has = m => { for (let i = 0; i < 7; i++) { const x = new Date(m); x.setDate(x.getDate() + i); if (t.has(dayKey(x))) return true; } return false; };
  const m = monday(new Date());
  if (!has(m)) m.setDate(m.getDate() - 7);   // diese Woche noch offen: zählt bis letzte Woche
  let n = 0;
  while (has(m)) { n++; m.setDate(m.getDate() - 7); }
  return n;
}
function calCard() {
  const now = new Date(), cm = ui.cal || (ui.cal = {y: now.getFullYear(), m: now.getMonth()});
  const {t, r} = activity(), todayK = dayKey(now);
  const days = new Date(cm.y, cm.m + 1, 0).getDate(), lead = (new Date(cm.y, cm.m, 1).getDay() + 6) % 7;
  let cells = '<span></span>'.repeat(lead), nt = 0, nr = 0;
  for (let d = 1; d <= days; d++) {
    const k = cm.y + '-' + String(cm.m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const isT = t.has(k), isR = !isT && r.has(k);
    if (isT) nt++; if (isR) nr++;
    cells += `<button class="cd ${isT ? 't' : isR ? 'r' : ''} ${k === todayK ? 'today' : ''} ${k > todayK ? 'fut' : ''}" data-act="calday" data-k="${k}">${isT || isR ? '✓' : d}</button>`;
  }
  const st = streak(), ws = weekStreak(), title = new Date(cm.y, cm.m, 1).toLocaleDateString('de-DE', {month: 'long', year: 'numeric'});
  return `<div class="card"><div class="row" style="margin-bottom:8px;gap:6px"><button class="navb" data-act="calprev">‹</button><b style="font-size:16px;white-space:nowrap">${title}</b><button class="navb" data-act="calnext">›</button><div class="sp"></div><div style="text-align:right"><div style="font-size:22px;font-weight:800">🔥 ${st}</div><div class="small mut" style="white-space:nowrap">in Folge</div></div></div>
    <div class="cal">${['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map(x => `<div class="wd">${x}</div>`).join('')}${cells}</div>
    <div class="small mut" style="margin-top:10px"><span style="color:var(--acc)">●</span> Training ${nt} &nbsp; <span style="color:#3b82f6">●</span> Pause ${nr} &nbsp;·&nbsp; 📅 ${ws} ${ws === 1 ? 'Woche' : 'Wochen'} in Folge</div>
    <div class="small mut" style="margin-top:4px">Tag antippen = Pause abhaken</div></div>`;
}

const PA = [0, 5, 20, 50, 80, 95];
function stdAt(key, bw) {
  const t = stdTab(key), b = Math.max(t[0][0], Math.min(t[t.length - 1][0], bw));
  let i = 0; while (i < t.length - 2 && b >= t[i + 1][0]) i++;
  const f = (b - t[i][0]) / (t[i + 1][0] - t[i][0]);
  return t[i].slice(1).map((v, k) => v + (t[i + 1][k + 1] - v) * f);
}
function pAtVal(std, v) {           // Wert -> Prozent der Lifter, die du übertriffst
  const V = [0, ...std];
  if (v >= V[5]) return Math.min(99.9, 95 + (v / V[5] - 1) * 40);
  if (v <= 0) return 0;
  let i = 0; while (i < 4 && v >= V[i + 1]) i++;
  return PA[i] + (PA[i + 1] - PA[i]) * (v - V[i]) / (V[i + 1] - V[i]);
}
function valAtP(std, p) {           // Prozent -> nötiger Wert
  const V = [0, ...std];
  if (p >= 95) return V[5] * (1 + (p - 95) / 40);
  let i = 0; while (i < 4 && p >= PA[i + 1]) i++;
  return V[i] + (V[i + 1] - V[i]) * (p - PA[i]) / (PA[i + 1] - PA[i]);
}
// Vergleich mit ALLEN (Männern bzw. Frauen): Mischung über alle Gewichtsklassen. Die Verteilung der Körpergewichte ist so gewählt,
// dass die Mitte je Übung dem von Strength Level genannten Durchschnitt entspricht (Abweichung ≤ 6 %).
const SEXK = () => (S && S.profile && S.profile.sex === 'f') ? 'f' : 'm';
const stdTab = key => STDS[SEXK()][key];
const POPP = () => SEXK() === 'f' ? {mu: 64, sd: 8} : {mu: 78, sd: 12};
const POPW = {};
function popW(key) {
  const ck = SEXK() + key;
  if (!POPW[ck]) {
    const t = stdTab(key), P = POPP();
    POPW[ck] = t.map((r, i) => Math.exp(-0.5 * ((r[0] - P.mu) / P.sd) ** 2) * (i === 0 ? t[1][0] - r[0] : i === t.length - 1 ? r[0] - t[i - 1][0] : (t[i + 1][0] - t[i - 1][0]) / 2));
  }
  return POPW[ck];
}
const cmpMode = () => S.settings.cmp === 'bw' ? 'bw' : 'all';
function pOf(key, v, bw) {
  if (cmpMode() === 'bw') return pAtVal(stdAt(key, bw), v);
  const w = popW(key); let a = 0, sum = 0;
  stdTab(key).forEach((r, i) => { a += w[i] * pAtVal(r.slice(1), v); sum += w[i]; });
  return a / sum;
}
function valOfP(key, p, bw) {
  if (cmpMode() === 'bw') return valAtP(stdAt(key, bw), p);
  let lo = 0, hi = stdTab(key)[stdTab(key).length - 1][5] * 3;
  for (let k = 0; k < 50; k++) { const m = (lo + hi) / 2; if (pOf(key, m, bw) < p) lo = m; else hi = m; }
  return (lo + hi) / 2;
}
// 6 Ränge mit je 3 Stufen = 18 Stufen (Grenzen in % der übertroffenen Lifter)
const TIERS = ['Bronze', 'Silber', 'Gold', 'Platin', 'Diamant', 'Elite'];
const TCOL = ['#cd7f32', '#b4bccb', '#f0b429', '#38bdf8', '#a855f7', '#ec4899'], ROM = ['I', 'II', 'III'];
// Untergrenzen der 18 Stufen in % (Gold I ab 30, Gold II ab 40, Gold III ab 50)
const SUBB = [0, 5, 10, 15, 20, 25, 30, 40, 50, 60, 67, 73, 80, 85, 90, 95, 97, 99];
const SUB = SUBB.map((p, i) => ({p, t: Math.floor(i / 3), label: TIERS[Math.floor(i / 3)] + ' ' + ROM[i % 3], color: TCOL[Math.floor(i / 3)]}));
function rankOf(p) {
  let i = 0; while (i < SUB.length - 1 && p >= SUB[i + 1].p) i++;
  const r = SUB[i], nx = SUB[i + 1] || null, hi = nx ? nx.p : 100;

function liftStat(D, bw) {

      if (r < 1) return;

      let v;
      if (D.reps === 'r') {                         // reine Wiederholungs-Übung
        if (e.mode !== 'r') return;
        v = r;
      } else if (D.reps) {                          // Klimmzüge: Zusatzgewicht in gleichwertige Körpergewichts-Wiederholungen umrechnen
        if (e.mode !== 'bw') return;

      } else {
        if (e.mode !== 'w' || w <= 0) return;

  const cand = hits.filter(h => recent.includes(h.date)).sort((a, b) => b.v - a.v)[0];

/* ---------- Pausentimer ---------- */
let T = null, actx = null, wake = null;
function unlockAudio() {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {}
}
function beep() {
  try {
    if (!actx) return;
    [0, .25, .5].forEach((t, k) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = k === 2 ? 1175 : 880; o.connect(g); g.connect(actx.destination);
      const st = actx.currentTime + t; g.gain.setValueAtTime(.0001, st); g.gain.exponentialRampToValueAtTime(.4, st + .02); g.gain.exponentialRampToValueAtTime(.0001, st + .2);
      o.start(st); o.stop(st + .22);
    });
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
}
function startTimer(sec, label) { T = {end: Date.now() + sec * 1000, total: sec, label, fired: false}; tickTimer(); }
function tickTimer() {
  const el = $('#timer');
  if (!T) { el.hidden = true; return; }
  el.hidden = false;
  const left = Math.ceil((T.end - Date.now()) / 1000);
  $('#tlabel').textContent = T.label;
  if (left <= 0) {
    if (!T.fired) { T.fired = true; T.doneAt = Date.now(); beep(); }
    if (Date.now() - T.doneAt > 8000) { T = null; el.hidden = true; return; }
    el.classList.add('end'); $('#ttime').textContent = 'Los! 💪'; $('#tbar').style.width = '100%';
  } else {
    el.classList.remove('end');
    $('#ttime').textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
    $('#tbar').style.width = (100 - left / T.total * 100) + '%';
  }
}
setInterval(tickTimer, 250);
async function keepAwake() {
  try { if ('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { checkUpdate(); tickTimer(); if (S.draft && S.draft.entries.some(e => e.done.some(Boolean))) keepAwake(); } });

/* ---------- Aktionen ---------- */
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}
function finish() {
  const d = S.draft; if (!d) return;
  const open = d.entries.reduce((a, e) => a + e.done.filter(x => !x).length, 0);
  if (d.entries.every(e => e.done.every(x => !x))) { toast('Noch kein Satz abgehakt'); return; }
  if (!confirm(open ? `${open} Satz/Sätze nicht abgehakt – sie zählen als nicht gemacht. Trotzdem speichern?` : 'Training abschließen und speichern?')) return;
  const session = {id: uid(), date: Date.now(), type: d.type, label: LABEL[d.type], entries: d.entries.map(e => { const c = {...e, reps: effReps(e).slice()}; delete c.done; return c; })};
  const prev = lastSession(d.type);
  let lines = '';
  session.entries.forEach(e => {
    const pe = lastEntry(e.exId), hit = hitAll(e), px = planOf(d.type).find(p => p.id === e.exId);
    let msg, cls = 'mut';
    if (e.mode === 'r') { msg = hit ? '🎉 Obergrenze erreicht – nächstes Mal schwerer machen' : '➡ Weiter bis ' + e.max + ' Wdh. in allen Sätzen'; cls = hit ? 'up' : 'mut'; }
    else {
      const next = hit ? round025(e.weight + e.inc) : e.weight;
      if (px) px.weight = next;
      const add = e.mode === 'bw' ? 'Zusatz ' : '';
      msg = hit ? `⬆ Nächstes Mal ${add}${fmt(next)} kg` : `➡ Bleibt bei ${add}${fmt(next)} kg (Ziel: alle Sätze × ${e.max})`; cls = hit ? 'up' : 'mut';
    }
    lines += `<div style="padding:8px 0;border-top:1px solid var(--line)"><b>${esc(e.name)}</b> <span class="small mut">${e.reps.join('/')} @ ${wLabel(e)}</span><div class="small">${pe ? delta(entryVol(e), entryVol(pe), unit(e)) : 'erstes Mal'}</div><div class="small ${cls}">${msg}</div></div>`;
  });
  S.sessions.push(session);
  S.pos = (S.pos + 1) % S.cycle.length;
  S.draft = null; T = null; tickTimer();
  try { wake && wake.release(); } catch (e) {}
  save();
  ui.modal = `<div class="modal"><div class="sheet"><h2>Training gespeichert ✅</h2>
    <div class="card"><div class="mut small">Gesamtvolumen ${LABEL[session.type]}</div><div style="font-size:24px;font-weight:800">${fmt(sessVol(session))} kg</div><div class="small">${delta(sessVol(session), prev ? sessVol(prev) : 0)}</div></div>
    ${lines}<button class="btn" style="margin-top:14px" data-act="closemodal">Weiter</button></div></div>`;
  render();
}

  if (t.dataset.dayname) {
    const dd = S.days.find(x => x.id === t.dataset.dayname), nn = t.value.trim().slice(0, 24);
    if (dd && nn) { dd.name = nn; dd.short = nn.slice(0, 5); save(); }
    render(); return;
  }
  if (t.dataset.prof && S.profile) {
    if (t.dataset.prof === 'name') S.profile.name = t.value.trim().slice(0, 30);
    else { const v = num(t.value); S.profile.height = (isFinite(v) && v >= 120 && v <= 230) ? Math.round(v) : null; }
    save(); render(); return;
  }
  if (t.dataset.act === 'winp') {
    const v = num(t.value);
    if (isFinite(v) && v >= 0) { S.draft.entries[+t.dataset.i].weight = round025(v); save(); }
    render(); return;
  }
  if (t.dataset.act === 'sdate') {
    const x = S.sessions.find(z => z.id === t.dataset.id), m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(t.value);
    if (x && m) {
      const o = new Date(x.date), nd = new Date(+m[1], +m[2] - 1, +m[3], o.getHours(), o.getMinutes());
      if (!isNaN(nd) && nd.getTime() <= Date.now() + 86400000) { x.date = nd.getTime(); S.sessions.sort((a, b) => a.date - b.date); save(); }
    }
    render(); return;
  }
  if (t.dataset.plan) {
    const ty = t.dataset.t, ex = S.plan[ty][+t.dataset.i], f = t.dataset.plan;
    if (f === 'name') {
      const nn = t.value.trim();
      if (nn && nn !== ex.name) {
        // Andere Übung => eigener Verlauf, damit sich Statistiken nicht vermischen
        if (confirm(`„${nn}" ist eine ANDERE Übung?\n\nOK = neuer, getrennter Verlauf (Startgewicht bitte prüfen)\nAbbrechen = nur Schreibweise korrigieren, Verlauf bleibt`)) ex.id = 'x_' + uid();
        ex.name = nn;
      }
    } else if (f === 'mode') {
      ex.mode = t.value;
      if (ex.mode === 'r') ex.weight = 0;
    } else {
      const v = num(t.value);
      if (isFinite(v) && (v > 0 || (f === 'weight' && v >= 0))) {
        ex[f] = (f === 'sets' || f === 'min' || f === 'max' || f === 'rest') ? Math.round(v) : round025(v);
        if (f === 'min' && ex.min > ex.max) ex.max = ex.min;
        if (f === 'max' && ex.max < ex.min) ex.min = ex.max;
      }
    }
    invalidateDraft(ty); save(); render();
  }
});

async function checkUpdate() {
  try {
    const j = await (await fetch('version.json?t=' + Date.now(), {cache: 'no-store'})).json();
    if (j && j.v > APP_V) $('#upd').hidden = false;
  } catch (e) {}
}
async function doUpdate() {
  try {
    const r = await navigator.serviceWorker.getRegistration(); if (r) await r.unregister();
    const ks = await caches.keys(); await Promise.all(ks.filter(k => k.startsWith('tt-')).map(k => caches.delete(k)));
  } catch (e) {}
  location.replace(location.pathname + '?u=' + Date.now());
}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
checkUpdate();
render();
</script>
